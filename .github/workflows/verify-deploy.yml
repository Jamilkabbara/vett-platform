# Pass 38 DEPLOY-4 — fail-fast frontend deploy verification.
#
# Previous Pass 37 A10 workflow soft-failed on SHA-not-in-HTML because
# the SHA-in-HTML heuristic had false negatives (Vite content-hashes
# assets independently of git SHA). With Pass 38 DEPLOY-3 shipping
# /version.json containing the exact built SHA + pass number, the
# verification gate is unambiguous and can hard-fail.
#
# Doctrine #20 (new in Pass 38): every frontend deploy must expose
# its SHA + pass at /version.json. Doctrine #17 (Pass 37): "shipped"
# = deployed in production, not just merged. This workflow turns
# Doctrine #17 from a process commitment into a CI gate.

name: Verify Deploy

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, edited, reopened]
  workflow_dispatch: # allow manual re-run for spot checks

jobs:
  verify-frontend-deploy:
    # Only the post-merge verification runs on push-to-main.
    # On PR events, the screenshot check below is the gate.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Pass 45 T7b — must exceed DEPLOY_WAIT_S (20 min) plus checkout.
    timeout-minutes: 25
    steps:
      - name: Check out merged code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Capture expected SHA + pass
        id: expected
        run: |
          # The merge commit SHA on main. This is what Vercel should
          # have built from. github.sha on push events points exactly
          # at the merged-into-main commit.
          EXPECTED_SHA="${{ github.sha }}"
          # vettPass lives at the top level of package.json (Pass 38
          # DEPLOY-3). jq -r returns the number as a string; bash
          # numeric compare against integer works correctly.
          EXPECTED_PASS=$(jq -r .vettPass < package.json)
          echo "sha=$EXPECTED_SHA"   >> "$GITHUB_OUTPUT"
          echo "pass=$EXPECTED_PASS" >> "$GITHUB_OUTPUT"
          echo "Expecting: sha=$EXPECTED_SHA, pass=$EXPECTED_PASS"

      - name: Wait for Vercel deploy via /version.json
        env:
          EXPECTED_SHA:  ${{ steps.expected.outputs.sha }}
          EXPECTED_PASS: ${{ steps.expected.outputs.pass }}
          ORIGIN:        ${{ secrets.PROD_ORIGIN || 'https://www.vettit.ai' }}
          # Vercel auto-deploys complete in ~90s p50, but queueing +
          # build cache misses push the tail well past 5 min. Pass 45
          # T7b: poll up to 20 min so a slow-but-successful deploy
          # never false-fails the gate (it false-failed once at 6 min).
          DEPLOY_WAIT_S: 1200
          POLL_EVERY_S: 30
        run: |
          set -euo pipefail
          elapsed=0
          last_resp=""
          while [ "$elapsed" -lt "$DEPLOY_WAIT_S" ]; do
            if resp=$(curl -fsS --max-time 10 "$ORIGIN/version.json" 2>/dev/null); then
              last_resp="$resp"
              live_sha=$(echo "$resp" | jq -r '.sha // empty')
              live_pass=$(echo "$resp" | jq -r '.pass // empty')
              # Pass MUST be >= expected (catches the case where
              # someone bumped vettPass but Vercel ran an older build,
              # but allows the next pass to come along without forcing
              # this workflow to retro-fail).
              if [ "$live_sha" = "$EXPECTED_SHA" ] \
                 && [ "$live_pass" -ge "$EXPECTED_PASS" ]; then
                echo "✅ Frontend deploy verified."
                echo "    sha:  $live_sha"
                echo "    pass: $live_pass"
                exit 0
              fi
              echo "Deploy still propagating: live sha=$live_sha pass=$live_pass, expected sha=$EXPECTED_SHA pass=$EXPECTED_PASS (elapsed ${elapsed}s)"
            else
              echo "Could not reach $ORIGIN/version.json — likely 404 if DEPLOY-3 hasn't shipped to prod yet (elapsed ${elapsed}s)"
            fi
            sleep "$POLL_EVERY_S"
            elapsed=$((elapsed + POLL_EVERY_S))
          done
          echo "::error::Frontend deploy did not propagate within ${DEPLOY_WAIT_S}s."
          echo "::error::Last observed /version.json response: ${last_resp:-<unreachable>}"
          echo "::error::Expected: sha=$EXPECTED_SHA, pass>=$EXPECTED_PASS"
          echo "::error::Doctrine #17: shipped means deployed. Manual fix needed:"
          echo "::error::  1. Vercel dashboard -> vett-platform -> Deployments — confirm"
          echo "::error::     latest deployment shows Production tag with the merge SHA"
          echo "::error::  2. If not: trigger redeploy from the Vercel dashboard"
          echo "::error::  3. If /version.json still 404s: DEPLOY-3 may not have made it"
          echo "::error::     to main yet — check that package.json scripts.build runs"
          echo "::error::     node scripts/write-version.js before vite build"
          exit 1

  tests:
    # PR C follow-up — the question-metadata strip has now regressed TWICE
    # (mapQuestion, then normaliseQuestions re-stripping what PR #65 fixed),
    # each time silently, because nothing executed the proof. The repo has no
    # test runner, so the round-trip harness was a script a human had to
    # remember to run — i.e. exactly the condition that let the strip come back.
    # This job runs it on every PR and every push, so a third regression fails
    # CI instead of quietly deleting customer analysis metadata.
    #
    # The harness reads the REAL DashboardPage.normaliseQuestions,
    # aiService.mapQuestion and MissionControlQuestions.emit off disk and drives
    # create -> load -> edit -> persist through them, asserting that an unknown
    # key (`some_future_tag`) survives. It cannot drift from the code it guards.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # `npm ci` (not `npm install`) so the harness runs against the exact
      # locked dependency tree — it transpiles with esbuild, which the repo
      # gets transitively via vite.
      - run: npm ci
      # The job id above is the name that appears as the required check, so it
      # says what it covers. It used to be "question-metadata-roundtrip", which
      # named ONE of the checks `npm test` runs; there are 21, including the
      # landing figures, the storage-URL ban and the quality notice. A check
      # whose name hides what it protects is how an unwired check goes unnoticed.
      - name: npm test (every site check)
        run: npm test

  require-screenshot-in-pr:
    # Pass 38 A10 — Doctrine #19: every PR description must include a
    # production screenshot link. The screenshot is the user-visible
    # gate; this CI step enforces it on PR open / synchronize.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR description for screenshot link
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;
            const body = pr.body || '';

            // Why this is stricter than "does the word appear".
            //
            // The first pattern used to be /screenshot/i, so the WORD passed.
            // #156 said "Screenshot: ... I cannot screenshot the authenticated
            // results page" and sailed through; it was the change that left
            // every Creative Attention report blank in production for a day.
            // #157 said "Screenshot: not applicable". Both were green.
            const excuses = [
              /screenshots?\s*[:\-]?\s*(not applicable|n\/?a\b|none|skipped|tbd)/i,
              /(cannot|can't|could not|couldn't|unable to)\s+screenshot/i,
              /no screenshots?\s+(needed|required|possible)/i,
            ];
            // Quoting an excuse is not making one. A post-mortem that cites
            // "Screenshot: not applicable" to explain why this check changed
            // must not be blocked by its own example, so fenced code, inline
            // code and blockquotes are stripped before the excuse scan.
            const prose = body
              .replace(/```[\s\S]*?```/g, ' ')
              .replace(/`[^`\n]*`/g, ' ')
              .split('\n').filter((l) => !/^\s*>/.test(l)).join('\n');

            const excuse = excuses.find((re) => re.test(prose));
            if (excuse) {
              core.setFailed(
                'Doctrine #19 - this PR explains why it has no screenshot. ' +
                'That is the failure mode this check exists to stop: a change ' +
                'can pass every data check and still render a blank page. ' +
                'Open the page and say what you saw.'
              );
              return;
            }

            // An image, where one can be published.
            const imageHosts = [
              /prnt\.sc/i, /imgur\.com/i, /cleanshot\.com/i, /d\.pr\//i,
              /dropbox\.com/i, /github\.com\/.*\.(png|jpg|jpeg)/i,
              /user-images\.githubusercontent\.com/i,
              /private-user-images\.githubusercontent\.com/i,
              /!\[[^\]]*\]\([^)]+\)/,
            ];
            const hasImage = imageHosts.some((re) => re.test(body));

            // This repository is PUBLIC, so a signed-in page must not be
            // screenshotted into it - that would republish the customer content
            // the app takes care to keep private. For those, the evidence is a
            // named URL plus what was on it, handed over out of band.
            const hasUrl = /https:\/\/(www\.)?vettit\.ai\/\S+/i.test(body);
            const hasLooked = /^\s*(looked at|verified on|evidence)\s*:/im.test(body);

            if (hasImage || (hasUrl && hasLooked)) {
              core.info(
                hasImage
                  ? '✅ Screenshot image found in the PR description.'
                  : '✅ Named production URL plus an Evidence/Looked at line.'
              );
            } else {
              core.setFailed(
                'Doctrine #19 - a PR must show the page, not mention it. Either:\n' +
                '  (a) embed a screenshot image, or\n' +
                '  (b) for a signed-in page (this repo is public, so do not post ' +
                'customer content here): give the https://www.vettit.ai/... URL ' +
                'you opened AND a line starting "Looked at:" or "Evidence:" ' +
                'saying what rendered.'
              );
            }
